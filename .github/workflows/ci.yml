name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
        working-directory: app

  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        working-directory: app

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: pio run
        working-directory: firmware

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cmake -S firmware/sim -B build-sim && cmake --build build-sim -j
      - name: Render every screen headless
        working-directory: firmware
        run: |
          SDL_VIDEODRIVER=dummy SIM_TAPS=3000,5000,7000,9000,13000 SIM_SHOT_MS=14300 SIM_SHOT=shot.bmp ../build-sim/meter-sim
          test -s shot.bmp

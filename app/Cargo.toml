[package]
name = "openrouter-meter"
version = "1.0.0"
edition = "2021"
description = "Companion app for the OpenRouter Meter desk display"
license-file = "../LICENSE"
publish = false

[lib]
name = "ormeter"
path = "src/lib.rs"

[[bin]]
name = "OpenRouterMeter"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The tray app (src/main.rs) is Windows-only; the library builds and tests anywhere.
[target."cfg(windows)".dependencies]
tao = "0.37.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

; OpenRouter Meter firmware — Waveshare ESP32-C6-Touch-AMOLED-2.16.
;   Build:  pio run
;   Flash:  pio run -t upload            (see docs/flashing.md for download mode)
;   Serial: pio device monitor
[platformio]
default_envs = meter

[env:meter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    ; The C6 only has USB-Serial/JTAG: both flags route Serial to USB.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DXPOWERS_CHIP_AXP2101
    ; NimBLE: peripheral only, one connection (the PC app).
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; LVGL configured by flags (no lv_conf.h). 96 KB object pool in internal RAM.
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_MEM_SIZE=98304
    -DLV_USE_LOG=0
    -DLV_USE_ARC=1
    -DLV_USE_LABEL=1
    -DLV_USE_LINE=1
    -DLV_USE_IMAGE=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lewisxhe/XPowersLib@^0.2.7
    lewisxhe/SensorLib@^0.2.6
    lvgl/lvgl@~9.6.0
    bblanchon/ArduinoJson@^7.4.0
    h2zero/NimBLE-Arduino@^2.5.0
